<title>家計帳</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<style>
  :root{
    --paper:#FAF7F0; --ink:#1F2937; --line:#C9C2B0; --seal:#B33A3A;
    --indigo:#2C4A6E; --gold:#B8935F; --income:#3D6B7D;
    --chip-bg:#F0EBDD; --chip-text:#6B6350; --muted:#9C9482; --card-border:#E7E1D3;
    --fixed:#2C4A6E; --variable:#B8935F; --special:#B33A3A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;}
  #app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
  header.top{padding:18px 18px 10px;display:flex;align-items:baseline;justify-content:space-between;}
  header.top h1{font-size:22px;margin:0;color:var(--indigo);font-weight:700;letter-spacing:.03em;}
  header.top p{font-size:11px;margin:2px 0 0;color:var(--muted);}
  .seal{width:36px;height:36px;border-radius:50%;border:2px solid var(--seal);color:var(--seal);
    display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
  main{flex:1;padding:12px 14px 90px;overflow-y:auto;}
  nav.bottom{position:fixed;bottom:0;left:0;right:0;max-width:720px;margin:0 auto;background:#fff;
    border-top:1px solid var(--card-border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20;}
  nav.bottom button{flex:1;background:none;border:none;padding:8px 2px 6px;font-size:10px;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;}
  nav.bottom button.active{color:var(--indigo);font-weight:600;}
  nav.bottom svg{width:20px;height:20px;}
  .card{background:#fff;border:1px solid var(--card-border);border-radius:10px;padding:14px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .card h3{font-size:13px;margin:0 0 10px;color:var(--indigo);font-weight:600;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  label.field{display:block;font-size:12px;color:var(--muted);margin-bottom:8px;}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 9px;
    margin-top:3px;font-size:14px;background:#FFFEFB;font-family:inherit;color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--indigo);outline-offset:1px;}
  button.btn{border:none;border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;color:#fff;
    background:var(--indigo);font-family:inherit;width:100%;}
  button.btn.ghost{background:var(--chip-bg);color:var(--chip-text);}
  button.btn.seal-btn{background:var(--seal);}
  button.btn.income-btn{background:var(--income);}
  button.btn:disabled{opacity:.6;}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 9px;border-radius:99px;
    background:var(--chip-bg);color:var(--chip-text);margin:0 6px 6px 0;}
  .chip button{background:none;border:none;color:inherit;font-size:12px;padding:0;cursor:pointer;}
  .txn{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:13px;
    border-bottom:1px solid #F1ECE0;gap:6px;}
  .txn:last-child{border-bottom:none;}
  .txn .date{color:var(--muted);width:60px;flex-shrink:0;}
  .txn .store{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .txn .cat{flex-shrink:0;font-size:10px;background:var(--chip-bg);color:var(--chip-text);
    padding:2px 7px;border-radius:99px;}
  .amt{font-weight:600;flex-shrink:0;}
  .amt.income{color:var(--income);}
  .del-btn{background:none;border:none;color:var(--seal);opacity:.6;padding:2px;flex-shrink:0;}
  .empty{text-align:center;color:#B0A990;font-size:13px;padding:26px 0;}
  .stat{flex:1;}
  .stat .lbl{font-size:11px;color:var(--muted);}
  .stat .val{font-size:18px;font-weight:700;margin-top:2px;}
  .toggle2{display:flex;gap:8px;margin-bottom:10px;}
  .toggle2 button{flex:1;padding:8px;border-radius:8px;border:none;font-size:13px;font-family:inherit;
    background:var(--chip-bg);color:var(--chip-text);}
  .toggle2 button.on-exp{background:var(--seal);color:#fff;}
  .toggle2 button.on-inc{background:var(--income);color:#fff;}
  .donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .donut{width:130px;height:130px;border-radius:50%;flex-shrink:0;position:relative;}
  .donut::after{content:"";position:absolute;inset:22px;border-radius:50%;background:#fff;}
  .legend{flex:1;min-width:140px;font-size:12px;}
  .legend .li{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .legend .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .majorblock{margin-bottom:10px;}
  .majorblock .mtitle{font-size:11px;font-weight:700;margin-bottom:4px;}
  .subrow{display:flex;justify-content:space-between;font-size:13px;padding-left:8px;margin-bottom:2px;}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:26px 10px;text-align:center;
    color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .drop img{max-height:200px;border-radius:6px;}
  .drop input[type=file]{display:none;}
  .toast{position:fixed;bottom:78px;left:16px;right:16px;max-width:688px;margin:0 auto;background:var(--indigo);
    color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.2);}
  .toast.error{background:var(--seal);}
  .hint{font-size:11px;color:#B0A990;margin-top:6px;line-height:1.5;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- utilities ---------- */
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function formatYen(n){var num=Number(n)||0;return "¥"+num.toLocaleString("ja-JP");}
function monthOf(d){return (d||"").slice(0,7);}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}

var PIE_COLORS=["#2C4A6E","#B33A3A","#B8935F","#5A7A63","#7B5E8C","#3D6B7D","#9C6644","#4E5D6C","#8C4A4A","#5F7A8C","#6E7F5C","#8A6F9E"];
var MAJOR_COLORS={"固定費":"#2C4A6E","変動費":"#B8935F","特別費":"#B33A3A"};

var DEFAULT_CATEGORY_GROUPS={
  "固定費":["住居費","通信費","保険","奨学金","保育教育費","投資"],
  "変動費":["食費","光熱費","日用品","交通費","医療費","交際費","被服美容費","外食費","雑費"],
  "特別費":["特別費"]
};
var DEFAULT_INCOME_CATEGORIES=["給与","賞与","副業","その他"];
var DEFAULT_PAYMENT_METHODS=["彰吾クレジット","千紗都クレジット","現金","口座引き落とし","その他"];
var PERSON_OPTIONS=["自分","妻"];

var CATEGORY_KEYWORDS={
  "食費":["スーパー","マート","食品","コンビニ","セブン","ローソン","ファミマ","イオン"],
  "外食費":["レストラン","カフェ","マクドナルド","スタバ","居酒屋","定食"],
  "光熱費":["電気","ガス","水道","東京電力","東京ガス"],
  "日用品":["ドラッグ","薬局","100円","ダイソー","ニトリ","無印"],
  "交通費":["jr ","交通","タクシー","駐車","ガソリン","eneos","定期","suica","pasmo","メトロ","バス"],
  "医療費":["病院","クリニック","歯科","医院","薬局"],
  "交際費":["贈答","プレゼント","ご祝儀","慶弔"],
  "被服美容費":["ユニクロ","gu ","zara","無印良品","しまむら","美容院","美容室","ネイル","化粧品"],
  "住居費":["家賃","管理費","駐車場","住宅ローン"],
  "通信費":["docomo","au ","softbank","楽天モバイル","wifi","プロバイダ"],
  "保険":["生命保険","損保","保険料","かんぽ","日本生命","第一生命","東京海上"],
  "奨学金":["奨学金","学生支援機構","jasso"],
  "保育教育費":["保育園","幼稚園","学費","授業料","塾","習い事"],
  "投資":["証券","積立","nisa","ideco","投信","投資信託"]
};

function guessCategory(text,groups){
  var flat=[].concat.apply([],Object.keys(groups).map(function(k){return groups[k];}));
  if(!text) return flat.indexOf("雑費")>=0?"雑費":flat[0];
  var lower=text.toLowerCase();
  for(var cat in CATEGORY_KEYWORDS){
    if(flat.indexOf(cat)<0) continue;
    var words=CATEGORY_KEYWORDS[cat];
    for(var i=0;i<words.length;i++){ if(lower.indexOf(words[i].toLowerCase())>=0) return cat; }
  }
  return flat.indexOf("雑費")>=0?"雑費":flat[0];
}
function majorOf(sub,groups){
  for(var m in groups){ if(groups[m].indexOf(sub)>=0) return m; }
  return Object.keys(groups)[0];
}
function normalizeDate(s){
  var m=s.match(/(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/);
  if(m) return m[1]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[3]).slice(-2);
  return "";
}

/* ---------- free client-side receipt OCR parsing (no API, no cost) ---------- */
function parseReceiptText(raw){
  var lines=raw.split(/\n/).map(function(l){return l.trim();}).filter(Boolean);
  var store="";
  for(var i=0;i<Math.min(lines.length,4);i++){
    if(lines[i].length>=2){ store=lines[i]; break; }
  }
  var dateMatch=raw.match(/(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/);
  var date=dateMatch?normalizeDate(dateMatch[0]):todayStr();

  var amount=0;
  var totalLineRe=/(合計|ご合計|お会計|総額|total)/i;
  for(var j=0;j<lines.length;j++){
    if(totalLineRe.test(lines[j])){
      var nums=lines[j].match(/[0-9][0-9,]{2,}/g);
      if(nums){ amount=Math.max.apply(null,nums.map(function(n){return parseInt(n.replace(/,/g,""),10);})); break; }
    }
  }
  if(!amount){
    var allNums=raw.match(/[0-9][0-9,]{2,}/g);
    if(allNums){ amount=Math.max.apply(null,allNums.map(function(n){return parseInt(n.replace(/,/g,""),10);})); }
  }
  return {store:store,date:date,amount:amount||0};
}

/* ---------- storage ---------- */
function loadState(){
  var tx=[]; var settings={}; var syncUrl=""; var person="";
  try{ var t=localStorage.getItem("kakeibo_transactions"); if(t) tx=JSON.parse(t); }catch(e){}
  try{ var s=localStorage.getItem("kakeibo_settings"); if(s) settings=JSON.parse(s); }catch(e){}
  try{ syncUrl=localStorage.getItem("kakeibo_syncurl")||""; }catch(e){}
  try{ person=localStorage.getItem("kakeibo_person")||""; }catch(e){}
  return {
    transactions:tx,
    categoryGroups:settings.categoryGroups||DEFAULT_CATEGORY_GROUPS,
    incomeCategories:settings.incomeCategories||DEFAULT_INCOME_CATEGORIES,
    paymentMethods:settings.paymentMethods||DEFAULT_PAYMENT_METHODS,
    syncUrl:syncUrl,
    person:person
  };
}
function saveTransactions(skipPush){
  try{ localStorage.setItem("kakeibo_transactions",JSON.stringify(state.transactions)); }catch(e){ toast("保存に失敗しました","error"); }
  if(!skipPush) pushToCloud();
}
function saveSettings(skipPush){
  try{ localStorage.setItem("kakeibo_settings",JSON.stringify({
    categoryGroups:state.categoryGroups, incomeCategories:state.incomeCategories, paymentMethods:state.paymentMethods
  })); }catch(e){ toast("設定の保存に失敗しました","error"); }
  if(!skipPush) pushToCloud();
}

/* ---------- cloud sync (Firebase Realtime Database REST API, free tier) ---------- */
var syncPollTimer=null;
function syncEndpoint(){
  if(!state.syncUrl) return null;
  return state.syncUrl.replace(/\/$/,"")+"/kakeibo-data.json";
}
function pushToCloud(){
  var url=syncEndpoint(); if(!url) return;
  var payload={
    transactions:state.transactions,
    settings:{categoryGroups:state.categoryGroups, incomeCategories:state.incomeCategories, paymentMethods:state.paymentMethods},
    updatedAt:Date.now()
  };
  state._lastSyncedAt=payload.updatedAt;
  fetch(url,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
    .then(function(res){ setSyncStatus(res.ok?"ok":"error"); })
    .catch(function(){ setSyncStatus("error"); });
}
function pullFromCloud(manual){
  var url=syncEndpoint(); if(!url) return;
  fetch(url).then(function(res){
    if(!res.ok) throw new Error("HTTP "+res.status);
    return res.json();
  }).then(function(remote){
    setSyncStatus("ok");
    if(!remote){ if(manual) pushToCloud(); return; }
    if(!state._lastSyncedAt || (remote.updatedAt && remote.updatedAt>state._lastSyncedAt)){
      state.transactions=remote.transactions||[];
      if(remote.settings){
        state.categoryGroups=remote.settings.categoryGroups||state.categoryGroups;
        state.incomeCategories=remote.settings.incomeCategories||state.incomeCategories;
        state.paymentMethods=remote.settings.paymentMethods||state.paymentMethods;
      }
      state._lastSyncedAt=remote.updatedAt||Date.now();
      saveTransactions(true); saveSettings(true);
      if(manual) toast("同期しました");
      if(document.getElementById("main")) document.getElementById("main").innerHTML=renderTab();
    }else if(manual){ toast("最新の状態です"); }
  }).catch(function(){ setSyncStatus("error"); if(manual) toast("同期に失敗しました。URLを確認してください","error"); });
}
function setSyncStatus(s){
  state.syncStatus=s;
  var el=document.getElementById("syncStatusTxt");

/* ---------- derived ---------- */
function monthTx(){ return state.transactions.filter(function(t){return monthOf(t.date)===state.month;}); }
function computeTotals(){
  var mt=monthTx();
  var expense=mt.filter(function(t){return t.type==="expense";});
  var income=mt.filter(function(t){return t.type==="income";});
  var expenseTotal=expense.reduce(function(s,t){return s+Number(t.amount||0);},0);
  var incomeTotal=income.reduce(function(s,t){return s+Number(t.amount||0);},0);
  var byMajor={};
  expense.forEach(function(t){ byMajor[t.majorCategory]=(byMajor[t.majorCategory]||0)+Number(t.amount||0); });
  var byMajorArr=Object.keys(byMajor).map(function(k){return {name:k,value:byMajor[k]};}).sort(function(a,b){return b.value-a.value;});
  var grouped={};
  expense.forEach(function(t){
    grouped[t.majorCategory]=grouped[t.majorCategory]||{};
    var cell=grouped[t.majorCategory][t.category]=grouped[t.majorCategory][t.category]||{total:0,byPerson:{}};
    cell.total+=Number(t.amount||0);
    var p=t.person||"未設定";
    cell.byPerson[p]=(cell.byPerson[p]||0)+Number(t.amount||0);
  });
  return {mt:mt,expenseTotal:expenseTotal,incomeTotal:incomeTotal,byMajorArr:byMajorArr,grouped:grouped};
}

/* ---------- dashboard ---------- */
function donutGradient(arr,total){
  if(total<=0) return "background:#F0EBDD;";
  var acc=0, stops=[];
  arr.forEach(function(d,i){
    var start=acc/total*100; acc+=d.value; var end=acc/total*100;
    var color=MAJOR_COLORS[d.name]||PIE_COLORS[i%PIE_COLORS.length];
    stops.push(color+" "+start.toFixed(2)+"% "+end.toFixed(2)+"%");
  });
  return "background:conic-gradient("+stops.join(",")+");";
}
function computeYtdComparison(){
  var refYear=parseInt(state.month.slice(0,4),10);
  var refMonth=parseInt(state.month.slice(5,7),10);
  function sumUpTo(year){
    return state.transactions.filter(function(t){
      if(t.type!=="expense") return false;
      var y=parseInt(t.date.slice(0,4),10);
      var m=parseInt(t.date.slice(5,7),10);
      return y===year && m<=refMonth;
    }).reduce(function(s,t){return s+Number(t.amount||0);},0);
  }
  var hasLastYearData=state.transactions.some(function(t){ return t.type==="expense" && parseInt(t.date.slice(0,4),10)===refYear-1; });
  return {refYear:refYear, refMonth:refMonth, thisYear:sumUpTo(refYear), lastYear:sumUpTo(refYear-1), hasLastYearData:hasLastYearData};
}

function handleReceiptFile(input){

function analyzeReceipt(){
  if(!state.receiptImage || typeof Tesseract==="undefined"){
    state.receiptError="OCRエンジンを読み込めませんでした。初回はインターネット接続が必要です。";
    document.getElementById("main").innerHTML=renderTab();
    return;
  }
  state.receiptAnalyzing=true; state.receiptProgress=0; state.receiptError=null;
  document.getElementById("main").innerHTML=renderTab();
  Tesseract.recognize(state.receiptImage.preview,"jpn+eng",{
    logger:function(m){
      if(m.status==="recognizing text"){
        state.receiptProgress=Math.round((m.progress||0)*100);
        var pEl=document.getElementById("receiptProgressTxt");
        if(pEl) pEl.textContent="解析中…"+state.receiptProgress+"%";
      }
    }
  }).then(function(result){
    var parsed=parseReceiptText(result.data.text||"");
    var category=guessCategory(parsed.store,state.categoryGroups);
    var major=majorOf(category,state.categoryGroups);
    state.receiptDraft={
      store:parsed.store, date:parsed.date, amount:parsed.amount,
      major:major, category:category,
      payment:state.paymentMethods.indexOf("現金")>=0?"現金":state.paymentMethods[0]
    };
  }).catch(function(e){
    state.receiptError="解析に失敗しました（"+e.message+"）。内容を手動で入力してください。";
    var firstMajor=Object.keys(state.categoryGroups)[0];
    state.receiptDraft={store:"",date:todayStr(),amount:0,major:firstMajor,category:state.categoryGroups[firstMajor][0],payment:state.paymentMethods[0]};
  }).finally(function(){
    state.receiptAnalyzing=false;
    document.getElementById("main").innerHTML=renderTab();
  });
}

/* ---------- csv import ---------- */
function parseCsv(text){
  var lines=text.replace(/\r\n/g,"\n").split("\n").filter(function(l){return l.length>0;});
  function splitLine(line){
    var out=[],cur="",inQ=false;
    for(var i=0;i<line.length;i++){
      var c=line[i];
      if(inQ){
        if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else inQ=false; }
        else cur+=c;
      }else{
        if(c===','){ out.push(cur); cur=""; }
        else if(c==='"'){ inQ=true; }
        else cur+=c;
      }
    }
    out.push(cur);
    return out;
  }
  if(lines.length===0) return {headers:[],rows:[]};
  var headers=splitLine(lines[0]).map(function(h){return h.trim();});
  var rows=lines.slice(1).map(function(l){
    var vals=splitLine(l); var o={};
    headers.forEach(function(h,i){ o[h]=(vals[i]||"").trim(); });
    return o;
  });
  return {headers:headers,rows:rows};
}
function handleCsvFile(input){
  var file=input.files[0]; if(!file) return;
  state.csvFileName=file.name;
  var reader=new FileReader();
  reader.onload=function(){
    var parsed=parseCsv(reader.result);
    state.csvHeaders=parsed.headers; state.csvRows=parsed.rows;
    function guess(keys){ return parsed.headers.find(function(h){ return keys.some(function(k){return h.toLowerCase().indexOf(k)>=0;}); })||""; }
    state.csvMapping={ date:guess(["日付","ご利用日","date","利用日"]), store:guess(["内容","利用先","店名","摘要","store","加盟店"]), amount:guess(["金額","ご利用金額","amount","利用金額"]) };
    recomputeCsvPreview();
    document.getElementById("main").innerHTML=renderTab();
  };
  reader.readAsText(file,"shift-jis");
}
function recomputeCsvPreview(){
  if(!state.csvRows || !state.csvMapping.date || !state.csvMapping.amount){ state.csvPreview=[]; return; }
  var rows=state.csvRows.map(function(r){
    var store=state.csvMapping.store?r[state.csvMapping.store]:"";
    var amountRaw=(r[state.csvMapping.amount]||"").toString().replace(/[¥,円\s]/g,"");
    var amount=Number(amountRaw);
    var dateRaw=(r[state.csvMapping.date]||"").toString().trim();
    var category=guessCategory(store,state.categoryGroups);
    return {id:uid(),date:normalizeDate(dateRaw),store:store||"(不明な利用先)",amount:amount,majorCategory:majorOf(category,state.categoryGroups),category:category,source:"csv"};
  }).filter(function(r){ return r.date && !isNaN(r.amount) && r.amount!==0; });
  state.csvPreview=rows;
}

  state.csvMapping[field]=val;

  var html='<div class="card"><h3>クレジットカード利用明細CSVを取込</h3>';
  html+='<label class="drop"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v13m0 0l-4-4m4 4l4-4M4 19h16"/></svg>'+
    esc(state.csvFileName||"CSVファイルを選択")+'<input type="file" accept=".csv" onchange="handleCsvFile(this)"></label>';
  html+='<p class="hint">各社の明細CSVに対応。列の意味を下で指定してください（文字コードはShift-JISとして読み込みます）。</p></div>';

  if(state.csvHeaders.length>0){
    html+='<div class="card"><h3>列の対応付け・支払方法</h3><div class="grid2">';
    ["date","store","amount"].forEach(function(f){
      var label=f==="date"?"日付の列":f==="store"?"利用先の列":"金額の列";
      html+='<label class="field">'+label+'<select onchange="onCsvMappingChange(\''+f+'\',this.value)"><option value="">選択してください</option>';
      state.csvHeaders.forEach(function(h){ html+='<option'+(h===state.csvMapping[f]?" selected":"")+'>'+esc(h)+'</option>'; });
      html+='</select></label>';
    });
    html+='<label class="field">この明細の支払方法<select onchange="onCsvBatchPaymentChange(this.value)">';
    state.paymentMethods.forEach(function(p){ html+='<option'+(p===state.csvBatchPayment?" selected":"")+'>'+esc(p)+'</option>'; });
    html+='</select></label></div></div>';
  }

  if(state.csvPreview.length>0){
    var allSubs=[].concat.apply([],Object.keys(state.categoryGroups).map(function(k){return state.categoryGroups[k];}));
    html+='<div class="card"><h3>プレビュー（'+state.csvPreview.length+'件・支払方法: '+esc(state.csvBatchPayment)+'）</h3>';
    state.csvPreview.forEach(function(r){
      html+='<div class="txn"><span class="date mono">'+esc(r.date.slice(5))+'</span><span class="store">'+esc(r.store)+'</span>'+
        '<select style="width:auto;font-size:11px;padding:3px 5px;" onchange="updateCsvRowCategory(\''+r.id+'\',this.value)">';
      allSubs.forEach(function(c){ html+='<option'+(c===r.category?" selected":"")+'>'+esc(c)+'</option>'; });
      html+='</select><span class="amt mono">'+formatYen(r.amount)+'</span></div>';
    });
    html+='<button class="btn" style="margin-top:10px;" onclick="confirmCsvImport()">この内容で家計簿に取り込む</button></div>';
  }
  return html;
}

/* ---------- manual entry / list ---------- */
function onManualTypeChange(t){
  state.manualType=t;
  document.getElementById("manualCatArea").innerHTML=manualCatAreaHtml();
  document.getElementById("manualStoreLabel").firstChild.textContent=(t==="expense"?"店名・内容":"収入元");
  document.getElementById("manualSubmitBtn").className="btn "+(t==="expense"?"seal-btn":"income-btn");
  document.getElementById("typeExpBtn").className=(t==="expense"?"on-exp":"");
  document.getElementById("typeIncBtn").className=(t==="income"?"on-inc":"");
}
function manualCatAreaHtml(){
  if(state.manualType==="expense"){
    return categoryPickerHtml("manual",state.manualMajor,state.manualCategory)+paymentSelectHtml("manualPay",state.manualPayment);
  }else{
    var h='<label class="field">収入カテゴリ<select id="manualIncCat">';
    state.incomeCategories.forEach(function(c){ h+='<option'+(c===state.manualIncomeCategory?" selected":"")+'>'+esc(c)+'</option>'; });
    h+='</select></label>';
    return h;
  }
}
function onmanualMajorChange(m){
  state.manualMajor=m; state.manualCategory=state.categoryGroups[m][0];
  document.getElementById("manualCatArea").innerHTML=manualCatAreaHtml();
}
function submitManual(){
  var date=document.getElementById("manualDate").value;
  var store=document.getElementById("manualStore").value.trim();
  var amount=Number(document.getElementById("manualAmount").value);
  if(!store||!amount) return;
  if(state.manualType==="expense"){
    var major=document.getElementById("manualMajor").value;
    var category=document.getElementById("manualCat").value;
    var payment=document.getElementById("manualPay").value;
    addTransactions([{id:uid(),type:"expense",date:date,store:store,amount:amount,majorCategory:major,category:category,paymentMethod:payment,memo:"",source:"manual",person:state.person||""}]);
  }else{
    var incCat=document.getElementById("manualIncCat").value;
    addTransactions([{id:uid(),type:"income",date:date,store:store,amount:amount,majorCategory:"収入",category:incCat,memo:"",source:"manual",person:state.person||""}]);
  }
  document.getElementById("main").innerHTML=renderTab();
  toast("記帳しました");
}
function onSearchInput(v){
  state._query=v;
  var box=document.getElementById("txnListBox");
  box.innerHTML=txnListHtml();
}
function txnListHtml(){
  var q=(state._query||"").toLowerCase();
  var filtered=state.transactions.filter(function(t){ return (t.store+t.category).toLowerCase().indexOf(q)>=0; });
  if(filtered.length===0) return '<div class="empty">取引がありません。</div>';
  var html='<div style="max-height:420px;overflow-y:auto;">';
  filtered.forEach(function(t){
    html+='<div class="txn"><span class="date mono">'+esc(t.date.slice(5))+'</span><span class="store">'+esc(t.store)+'</span>'+
      '<span class="cat">'+esc(t.category)+'</span>'+
      (t.person?'<span class="cat" style="background:transparent;color:var(--muted);">'+esc(t.person)+'</span>':'')+
      '<span class="amt mono'+(t.type==="income"?" income":"")+'">'+(t.type==="income"?"+":"-")+formatYen(t.amount)+'</span>'+
      '<button class="del-btn" onclick="deleteTxn(\''+t.id+'\');onSearchInput(state._query||\'\')">✕</button></div>';
  });
  html+='</div>';
  return html;
}
function renderList(){
  var html='<div class="card"><h3>手入力で追加</h3>';
  html+='<div class="toggle2"><button id="typeExpBtn" class="on-exp" onclick="onManualTypeChange(\'expense\')">支出</button>'+
    '<button id="typeIncBtn" onclick="onManualTypeChange(\'income\')">収入</button></div>';
  html+='<label class="field">日付<input id="manualDate" type="date" value="'+todayStr()+'"></label>';
  html+='<label class="field" id="manualStoreLabel">店名・内容<input id="manualStore"></label>';
  html+='<label class="field">金額<input id="manualAmount" type="number"></label>';
  html+='<div id="manualCatArea">'+manualCatAreaHtml()+'</div>';
  html+='<button class="btn seal-btn" id="manualSubmitBtn" style="margin-top:6px;" onclick="submitManual()">追加する</button>';
  html+='</div>';

  html+='<div class="card"><div class="row" style="margin-bottom:8px;"><h3 style="margin:0;">すべての取引（'+state.transactions.length+'件）</h3></div>';
  html+='<input placeholder="検索…" oninput="onSearchInput(this.value)" style="margin-bottom:8px;">';
  html+='<div id="txnListBox">'+txnListHtml()+'</div></div>';
  return html;
}

/* ---------- settings ---------- */
function addSub(major){
  var input=document.getElementById("newSub_"+major);
  var v=input.value.trim();
  if(!v || state.categoryGroups[major].indexOf(v)>=0) return;
  state.categoryGroups[major]=state.categoryGroups[major].concat([v]);
  saveSettings();
  document.getElementById("main").innerHTML=renderTab();
}
function removeSub(major,sub){
  state.categoryGroups[major]=state.categoryGroups[major].filter(function(x){return x!==sub;});
  saveSettings();
  document.getElementById("main").innerHTML=renderTab();
}
function addIncomeCat(){
  var input=document.getElementById("newIncomeCat");
  var v=input.value.trim();
  if(!v || state.incomeCategories.indexOf(v)>=0) return;
  state.incomeCategories=state.incomeCategories.concat([v]);
  saveSettings();
  document.getElementById("main").innerHTML=renderTab();
}
function removeIncomeCat(c){
  state.incomeCategories=state.incomeCategories.filter(function(x){return x!==c;});
  saveSettings();
  document.getElementById("main").innerHTML=renderTab();
}
function addPayment(){
  var input=document.getElementById("newPayment");
  var v=input.value.trim();
  if(!v || state.paymentMethods.indexOf(v)>=0) return;
  state.paymentMethods=state.paymentMethods.concat([v]);
  saveSettings();
  document.getElementById("main").innerHTML=renderTab();
}
function removePayment(p){
  state.paymentMethods=state.paymentMethods.filter(function(x){return x!==p;});
  saveSettings();
  document.getElementById("main").innerHTML=renderTab();
}
function setPerson(p){
  state.person=p;
  try{ localStorage.setItem("kakeibo_person",p); }catch(e){}
  document.getElementById("main").innerHTML=renderTab();
  toast("この端末の入力者を「"+p+"」に設定しました");
}
function renderSettings(){
  var html='<div class="card"><h3>この端末の入力者</h3>';
  html+='<p class="hint">ここで選んだ人が、この端末から記帳した支出・収入に記録されます。ホーム画面の「カテゴリ別内訳」で、妻の入力分が（　）内に表示されます。</p>';
  html+='<div class="toggle2" style="margin-top:8px;">';
  PERSON_OPTIONS.forEach(function(p){
    html+='<button style="background:'+(state.person===p?"var(--indigo)":"var(--chip-bg)")+';color:'+(state.person===p?"#fff":"var(--chip-text)")+';" onclick="setPerson(\''+p+'\')">'+esc(p)+'</button>';
  });
  html+='</div></div>';

  html+='<div class="card"><h3>クラウド同期（複数端末で共有）</h3>';
  if(state.syncUrl){
    html+='<p class="hint">同期先: <span class="mono">'+esc(state.syncUrl)+'</span><br>状態: <span id="syncStatusTxt">'+
      (state.syncStatus==="ok"?"同期済み":state.syncStatus==="error"?"同期エラー":"確認中…")+'</span></p>';
    html+='<div class="row" style="gap:8px;"><button class="btn ghost" style="width:auto;flex:1;padding:8px;" onclick="manualSyncNow()">今すぐ同期</button>'+
      '<button class="btn ghost" style="width:auto;flex:1;padding:8px;" onclick="disconnectSync()">同期を解除</button></div>';
  }else{
    html+='<label class="field">Firebase Realtime DatabaseのURL<input id="syncUrlInput" placeholder="https://xxxx-default-rtdb.firebasedatabase.app"></label>';
    html+='<button class="btn" onclick="connectSync()">接続する</button>';
    html+='<p class="hint">無料のFirebaseプロジェクトを1つ作成し、そのデータベースURLをここに貼り付けてください。同じURLを他の端末（もう1台のiPhone・パソコン）にも設定すると、入力内容が自動で反映されます。設定手順が必要な場合はお知らせください。<br>※ この方式はURLを知っていれば誰でも読み書きできる簡易的な共有です。URLは他人に教えないでください。</p>';
  }
  html+='</div>';

  html+='<div class="card"><h3>レシート読み取りについて</h3>'+
    '<p class="hint">端末内で完結する無料のOCR（Tesseract.js）でレシートを読み取ります。外部サービスへの送信や利用料は発生しません。初回起動時のみ、OCRエンジン自体の読み込みにインターネット接続が必要です。</p></div>';

  Object.keys(state.categoryGroups).forEach(function(major){
    html+='<div class="card"><h3 style="color:'+(MAJOR_COLORS[major]||"#2C4A6E")+'">'+esc(major)+'の内訳カテゴリ</h3><div>';
    state.categoryGroups[major].forEach(function(c){
      html+='<span class="chip">'+esc(c)+'<button onclick="removeSub(\''+major+'\',\''+esc(c)+'\')">✕</button></span>';
    });
    html+='</div><div class="row" style="gap:8px;margin-top:6px;"><input id="newSub_'+major+'" placeholder="新しい項目名" style="flex:1;">'+
      '<button class="btn ghost" style="width:auto;padding:8px 12px;" onclick="addSub(\''+major+'\')">追加</button></div></div>';
  });

  html+='<div class="card"><h3 style="color:var(--income)">収入カテゴリ</h3><div>';
  state.incomeCategories.forEach(function(c){ html+='<span class="chip">'+esc(c)+'<button onclick="removeIncomeCat(\''+esc(c)+'\')">✕</button></span>'; });
  html+='</div><div class="row" style="gap:8px;margin-top:6px;"><input id="newIncomeCat" placeholder="新しいカテゴリ名" style="flex:1;">'+
    '<button class="btn ghost" style="width:auto;padding:8px 12px;" onclick="addIncomeCat()">追加</button></div></div>';

  html+='<div class="card"><h3>支払方法</h3><div>';
  state.paymentMethods.forEach(function(p){ html+='<span class="chip">'+esc(p)+'<button onclick="removePayment(\''+esc(p)+'\')">✕</button></span>'; });
  html+='</div><div class="row" style="gap:8px;margin-top:6px;"><input id="newPayment" placeholder="新しい支払方法" style="flex:1;">'+
    '<button class="btn ghost" style="width:auto;padding:8px 12px;" onclick="addPayment()">追加</button></div></div>';

  return html;
}

render();
if(state.syncUrl){ pullFromCloud(false); startPolling(); }
</script>
</body>
</html>
